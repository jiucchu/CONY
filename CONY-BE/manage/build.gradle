plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cony'
version = '0.0.1-SNAPSHOT'
description = 'Cony Management Server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 1. Web & Security
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	
	// 2. DataBase: MySQL + Spatial(GeoFencing)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.hibernate.orm:hibernate-spatial' // 내 주변 매장 찾기용 (ST_Distance_Sphere; 공간 함수 라이브러리)

	// 3. DataBase: Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// 5. AWS S3 (image Upload)
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.0'

	// 6. Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'
	implementation 'org.apache.commons:commons-lang3:3.18.0' // 보안 취약점 경고로 인해 commons-lang3 버전 업데이트

	// 7. Batch
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	testImplementation 'org.springframework.batch:spring-batch-test'
	
	// 8. Firebase Admin SDK (FCM)
	implementation 'com.google.firebase:firebase-admin:9.3.0'

	// 0. Utils
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0' // SQL 파라미터 로그 라이브러리
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.orbisgis:h2gis:2.2.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
