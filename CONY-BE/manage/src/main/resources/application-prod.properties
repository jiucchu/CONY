## orc \uC11C\uBC84 \uC8FC\uC18C \uC785\uB825
ocr.api.url=${OCR_SERVER_URL}

# ==========================================
# 1. MySQL (AWS RDS)
# ==========================================
# \uC6B4\uC601 \uD658\uACBD\uC758 DB \uC8FC\uC18C\uB294 \uD658\uACBD\uBCC0\uC218\uB85C \uC8FC\uC785\uBC1B\uC2B5\uB2C8\uB2E4.
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USER}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# \uC6B4\uC601\uC5D0\uC11C\uB294 \uC808\uB300 update/create \uAE08\uC9C0 (validate: \uC2A4\uD0A4\uB9C8 \uAC80\uC99D\uB9CC \uC218\uD589)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show_sql=false

# ==========================================
# 2. Redis (AWS ElastiCache)
# ==========================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# ==========================================
# 3. OAuth2 Registration (Prod)
# ==========================================
# [Google]
spring.security.oauth2.client.registration.google.client-id=${PROD_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${PROD_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# [Kakao]
spring.security.oauth2.client.registration.kakao.client-id=${PROD_KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${PROD_KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.provider=kakao

# [Apple]
spring.security.oauth2.client.registration.apple.client-id=${PROD_APPLE_SERVICE_ID}
spring.security.oauth2.client.registration.apple.client-secret=${PROD_APPLE_CLIENT_SECRET_JWT}
spring.security.oauth2.client.registration.apple.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.apple.redirect-uri={baseUrl}/login/oauth2/code/apple
spring.security.oauth2.client.registration.apple.scope=name,email
spring.security.oauth2.client.registration.apple.provider=apple

# ==========================================
# 4. AWS S3 (Prod)
# ==========================================
spring.cloud.aws.s3.bucket=${S3_BUCKET_NAME}
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}

# ==========================================
# 5. Logging (Info/Error)
# ==========================================
# \uC6B4\uC601 \uB85C\uADF8 \uC591 \uC870\uC808
logging.level.root=info
logging.level.com.cony.manage=info


# ==========================================
# 6. Spring Batch
# ==========================================
spring.batch.jdbc.initialize-schema=never