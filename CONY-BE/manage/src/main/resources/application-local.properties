# ==========================================
# 1. MySQL (Localhost)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/cony?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# \uD658\uACBD\uBCC0\uC218\uAC00 \uC788\uC73C\uBA74 \uC4F0\uACE0, \uC5C6\uC73C\uBA74 root/admin \uC0AC\uC6A9 (\uD300\uC6D0 \uACF5\uD1B5 \uBE44\uBC00\uBC88\uD638)
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# \uAC1C\uBC1C \uC911\uC5D0\uB294 \uC2A4\uD0A4\uB9C8 \uC790\uB3D9 \uC5C5\uB370\uC774\uD2B8
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true

# ==========================================
# 2. Redis (Localhost)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# 3. OAuth2 Registration (\uACC4\uC815 \uC815\uBCF4)
# ==========================================
# Git\uC5D0 \uC62C\uB824\uB3C4 \uC548\uC804\uD558\uB3C4\uB85D \uC2E4\uC81C \uAC12\uC740 \uBE44\uC6CC\uB450\uAC70\uB098 \uD658\uACBD\uBCC0\uC218 \uCC98\uB9AC\uD569\uB2C8\uB2E4.
# IntelliJ \uC2E4\uD589 \uC124\uC815(Edit Configuration) -> Environment variables\uC5D0\uC11C \uC8FC\uC785\uD558\uC138\uC694.
# [Google]
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# [Kakao]
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.provider=kakao

# [Apple]
spring.security.oauth2.client.registration.apple.client-id=${APPLE_SERVICE_ID}
# Apple Secret\uC740 p8 \uD30C\uC77C\uB85C \uC0DD\uC131\uD55C JWT \uD1A0\uD070\uAC12\uC774\uC5B4\uC57C \uD569\uB2C8\uB2E4.
spring.security.oauth2.client.registration.apple.client-secret=${APPLE_CLIENT_SECRET_JWT}
spring.security.oauth2.client.registration.apple.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.apple.redirect-uri={baseUrl}/login/oauth2/code/apple
spring.security.oauth2.client.registration.apple.scope=name,email
spring.security.oauth2.client.registration.apple.provider=apple

# ==========================================
# 4. AWS S3 (Local)
# ==========================================
spring.cloud.aws.s3.bucket=${S3_BUCKET_NAME:cony-local-bucket}
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}

# ==========================================
# 5. Logging (Debug)
# ==========================================
logging.level.org.hibernate.SQL=debug
logging.level.com.cony.manage=debug