# ==========================================
# 1. Project Common Config
# ==========================================
spring.application.name=manage

# \uAE30\uBCF8 \uD65C\uC131 \uD504\uB85C\uD544 \uC124\uC815 (\uBCC4\uB3C4 \uC124\uC815 \uC5C6\uC73C\uBA74 local\uB85C \uB3D9\uC791)
spring.profiles.active=local

# ==========================================
# 2. JPA & Database Common (Architecture)
# ==========================================
# OSIV \uBE44\uD65C\uC131\uD654 (API \uC131\uB2A5 \uCD5C\uC801\uD654 \uD544\uC218)
spring.jpa.open-in-view=false

# [\uC911\uC694] \uC9C0\uC624\uD39C\uC2F1 \uAE30\uB2A5\uC744 \uC704\uD55C MySQL Spatial \uBC29\uC5B8 (\uD658\uACBD \uBB34\uAD00 \uACF5\uD1B5 \uC0AC\uD56D)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL \uD3EC\uB9F7\uD305 (\uB85C\uADF8 \uAC00\uB3C5\uC131)
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. File Upload (Multipart) & JSON Format (Jackson)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# 4. OAuth2 Provider Config (\uD1B5\uC2E0 \uC8FC\uC18C \uC815\uC758)
# Google\uC740 \uB0B4\uC7A5\uB418\uC5B4 \uC788\uC5B4 \uC124\uC815 \uBD88\uD544\uC694. Kakao, Apple\uC740 \uD544\uC218.
# ==========================================

# [Kakao Provider]
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# [Apple Provider]
spring.security.oauth2.client.provider.apple.authorization-uri=https://appleid.apple.com/auth/authorize
spring.security.oauth2.client.provider.apple.token-uri=https://appleid.apple.com/auth/token
spring.security.oauth2.client.provider.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
spring.security.oauth2.client.provider.apple.user-name-attribute=sub


# ==========================================
# 5. Nginx Proxy Setup
# ==========================================
# Nginx(\uB9AC\uBC84\uC2A4 \uD504\uB85D\uC2DC)\uAC00 \uBCF4\uB0B4\uC8FC\uB294 X-Forwarded-* \uD5E4\uB354\uB97C \uC2E0\uB8B0\uD558\uB3C4\uB85D \uC124\uC815
# \uC774\uAC83\uC774 \uC788\uC5B4\uC57C request.getRemoteAddr() \uB4F1\uC774 Nginx IP\uAC00 \uC544\uB2CC \uC2E4\uC81C \uC0AC\uC6A9\uC790 IP\uB85C \uCC0D\uD798
server.forward-headers-strategy=native



# ==========================================
# 6. Spring Batch
# ==========================================
spring.batch.job.enabled=false