version: '3.8'

services:
  payment:
    build: ./payment
    container_name: cony-payment
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      OCR_API_URL: ${OCR_API_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
    ports:
      - "8081:8080"
    networks:
      - cony-net

  manage:
    build: ./manage
    container_name: cony-manage
    environment:
      PROD_DB_URL: ${SPRING_DATASOURCE_URL}
      PROD_DB_USER: ${SPRING_DATASOURCE_USERNAME}
      PROD_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      OCR_SERVER_URL: ${OCR_API_URL}
      PROD_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PROD_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PROD_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      PROD_KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
    ports:
      - "8082:8080"
    networks:
      - cony-net

  ai:
    build: ./ai
    container_name: cony-ai
    environment:
      # AI 서비스가 DB를 사용하는 경우에만 필요
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8000:8000"
    networks:
      - cony-net

# 중요: 외부 네트워크 사용 선언
networks:
  cony-net:
    external: true
