# ==========================================
# Production Environment (Docker)
# ==========================================

# 1. Server Port (Internal Container Port)
# Must be 8080 to match docker-compose mapping (8081:8080)
server.port=8080

# 2. Database Configuration
# Using environment variables from docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate schema in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 3. Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# 4. AWS S3
spring.cloud.aws.s3.bucket=${S3_BUCKET_NAME}
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}

# 5. Internal Service Communication
# Use Docker service names instead of localhost
app.manage-server.url=http://cony-manage:8080
app.ai-server.url=http://cony-ai:8000

# 6. Kakao Pay Configuration
# Note: Redirect URLs must be accessible from the user's browser (External URL)
# So we use localhost:8081 (External Port) NOT 8080
kakao.pay.admin-key=${KAKAO_PAY_ADMIN_KEY:DEV71D4FE841FCDF93B24FAB0626CF0792041C0B}
kakao.pay.cid=${KAKAO_PAY_CID:TC0ONETIME}
kakao.pay.ready-url=https://open-api.kakaopay.com/online/v1/payment/ready
kakao.pay.approve-url=https://open-api.kakaopay.com/online/v1/payment/approve
kakao.pay.approval-redirect=http://localhost:8081/api/payment/payments/approve
kakao.pay.cancel-redirect=http://localhost:8081/api/payment/payments/cancel
kakao.pay.fail-redirect=http://localhost:8081/api/payment/payments/fail

# 7. Logging
logging.level.root=info
logging.level.com.cony.payment=info

# ==========================================
# 8. Proxy Configuration (Crucial for Nginx)
# ==========================================
server.forward-headers-strategy=framework

# ==========================================
# 9. Swagger URL Configuration (For Nginx)
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 1. Swagger UI Config URL
springdoc.swagger-ui.configUrl=/api/payment/v3/api-docs/swagger-config
# 2. Disable default URL guessing
springdoc.swagger-ui.disable-swagger-default-url=true
# 3. API Docs URL
springdoc.swagger-ui.url=/api/payment/v3/api-docs
