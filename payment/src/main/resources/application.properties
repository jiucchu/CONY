# ==========================================
# 1. Project Common Config
# ==========================================
spring.application.name=payment

# Port 8081 (avoid conflict with manage server on 8080)
server.port=8081

# API Base Path Prefix
server.servlet.context-path=/api/v1

# Default active profile (use application-local.properties if not specified)
spring.profiles.active=local

# ==========================================
# 2. JPA & Database Common (Architecture)
# ==========================================
# OSIV disabled (required for API performance optimization)
spring.jpa.open-in-view=false

# MySQL Dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL formatting for better readability in logs
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. File Upload & JSON Format
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# 5. Nginx Proxy Setup
# ==========================================
server.forward-headers-strategy=native

# ==========================================
# CORS Configuration (for WebConfig)
# ==========================================
# Frontend URL (comma-separated for multiple origins)
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allow-credentials=true

# ==========================================
# Frontend URL Configuration (For Redirects)
# ==========================================
app.frontend-url=http://localhost:3000